name: wikimedia
description: "wikimedia as a social media feed - Flutter App"
publish_to: 'none'

version: 1.0.1+101

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  sqflite: ^2.3.0
  path: ^1.9.0
  brotli: ^0.6.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  cached_network_image: ^3.3.1
  http: ^1.2.1
  webview_flutter: ^4.4.2
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/wiki_media_logo.png"
  image_path_android_foreground: "assets/wiki_media_logo.png"
  adaptive_icon_background_color: "#FFFFFF" # Or use an image path
  min_sdk_android: 21 # optional min sdk property, default 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.7

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true
